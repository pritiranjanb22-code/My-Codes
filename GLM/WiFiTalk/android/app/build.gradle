apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

import com.android.build.OutputFile

project.ext.react = [
    enableHermes: true,
    hermesCommand: "",
]

def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.wifitalk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libjsc.so"
        pickFirst "**/libhermes.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.facebook.react:react-native"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.android.gms:play-services-base:18.2.0"
    implementation "com.google.android.gms:play-services-location:21.0.1"
    implementation "com.google.android.gms:play-services-nearby:19.0.0"
    
    // React Native dependencies
    implementation project(':react-native-reanimated')
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-screens')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-async-storage')
    implementation project(':react-native-mmkv')
    implementation project(':react-native-sqlite-storage')
    implementation project(':react-native-udp')
    implementation project(':react-native-mdns')
    implementation project(':react-native-network-info')
    implementation project(':react-native-qrcode-svg')
    implementation project(':react-native-qrcode-scanner')
    implementation project(':react-native-permissions')
    implementation project(':react-native-background-fetch')
    implementation project(':react-native-push-notification')
    implementation project(':react-native-webrtc')
    implementation project(':react-native-fs')
    implementation project(':react-native-document-picker')
    implementation project(':react-native-image-picker')
    implementation project(':react-native-video')
    implementation project(':react-native-audio-recorder-player')
    implementation project(':react-native-sound')
    implementation project(':react-native-haptic-feedback')
    implementation project(':react-native-keep-awake')
    implementation project(':react-native-wifi-reborn')
    implementation project(':react-native-ble-plx')
    implementation project(':react-native-zeroconf')
    implementation project(':react-native-vector-icons')
    implementation project(':react-native-linear-gradient')
    implementation project(':react-native-blurhash')
    implementation project(':react-native-fast-image')
    implementation project(':react-native-modal')
    implementation project(':react-native-bottom-sheet')
    implementation project(':react-native-gifted-chat')
    implementation project(':react-native-calendars')
    implementation project(':react-native-paper')
    implementation project(':react-native-svg')
    
    // Navigation
    implementation project(':react-navigation')
    implementation project(':react-navigation-native')
    implementation project(':react-navigation-native-stack')
    implementation project(':react-navigation-bottom-tabs')
    implementation project(':react-navigation-material-top-tabs')
}

task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.implementation
    into 'libs'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesSettingsGradle(settings)
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)