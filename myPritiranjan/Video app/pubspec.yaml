name: watch_together
description: Cross-platform synchronized video watching and voice chat application
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Network & Discovery
  multicast_dns: ^0.3.4
  bonjour: ^3.1.0
  udp: ^6.0.0
  web_socket_channel: ^2.4.5
  http: ^1.2.1
  
  # Video Playback
  video_player: ^2.8.6
  chewie: ^1.7.5
  media_kit: ^1.1.11
  media_kit_video: ^1.1.5
  media_kit_libs_android_video: ^1.0.8
  media_kit_libs_ios_video: ^1.0.9
  
  # Audio & Voice
  record: ^5.0.4
  audioplayers: ^6.0.0
  just_audio: ^0.9.36
  audio_session: ^0.1.19
  
  # File & Storage
  path_provider: ^2.1.3
  file_picker: ^8.0.0+1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Crypto & Security
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  encrypt: ^5.0.3
  
  # QR Code
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  
  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  network_info_plus: ^5.0.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.2.6
  
  # Background & Foreground
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.4
  
  # Compression
  archive: ^3.6.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.10
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700